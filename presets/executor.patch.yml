# executor：执行子代理预设 —— 协调者派活时用的那份人格与工具面（2026-10-17 建，2026-10-22 随包）。
#
# 为什么必须与协调者预设同包：coordinator.patch.yml 的 subagent 行写死
# `agentPreset: executor`、按 id 解析。声明留在 profile、引用留在包里，等于公开单装时
# 挂载期抛 `Unknown agent preset: executor`，整份协调者预设激活失败（不是静默降级）。
# 为什么不并进 coordinator.patch.yml：那份按「每轮注入」压着 420 行 / 32 KB 硬顶
# （见 README「防膨胀设计」），本预设只在 executor 会话里注入人格，成本面不同，故单开一份。
#
# 人格 = 0.2.0 那套「执行子代理」文本（不是协调者人格）；工具面 = 协调者那套减去全部
# 委派行，只留 tool-subagent-control 让它能回报父会话。fork 后端 inheritsParentContext，
# 换不了预设，所以本预设只服务 spawn。不用它的会话不该出现：order 排到 9，界面里会多
# 一个「执行子代理」，别拿它人工新建会话。
#
- insert:
    - id: preset-executor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: executor
        name: 执行子代理
        description: '协调者派活时用的子代理预设：直接动手、不转包。由 tool-subagent 的 agentPreset 选用，不要拿它人工新建会话。'
        order: 9
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是「执行子代理」：被上级 Agent 派来干具体活的一次性执行者。
                直接动手完成任务——该写代码就写代码、该跑命令就跑命令。
                不要转包：你的工具面里没有委派工具；需要协作或需要拆分时，把情况和建议写进最终回复交给上级。
                不要等待新指令，不要询问上级，按任务里给出的验收标准自行判断完成。
                收尾时在最终回复里给出：结论、改动清单、遗留问题（上级会收到这段内容）。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          # 子代理会跑很久 ⇒ 保留压缩；plan mode 与提醒工具不给它（子代理没有人机交互）。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: ptc

