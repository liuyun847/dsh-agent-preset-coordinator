# coordinator：只委派、永不阻塞的协调者预设 —— bundle 声明行版（2026-09-24 迁移）。
#
# 本文件是组合包 dsh-agent-preset-coordinator 的 patch 层：一行
# `@deepseek-ai/dsh-agent-preset` 声明（preset id = `coordinator`），子插件列表在
# config.plugins 下；宿主经 profile 的 bundles 列表加载本包时应用本 patch。
# 派生自 shipped `standard`（行级对照与逐条差异见 skills/project-coordination/BASELINE.md；
# 重算差异与其数字：pwsh tools/preset_diff.ps1）。旧目录形态 .agent-presets\coordinator\
# 已废弃（rc.1 起不再被读取），权威副本就是本文件。
#
# ── 改动本文件时先看这三条（本文件是它们的唯一副本）─────────────────────────
#   1. shell / fs 行必须保留 —— 协调者与子代理共享同一套工具注册，禁掉等于子代理
#      再也跑不了构建 / 测试。"协调者只委派不执行"由 persona 纪律保证，不由工具面。
#   2. 子代理的人格与工具面由**独立预设** executor 承担（0.2.1 起 persona/toolFilter 已删）——
#      spawn 行用 agentPreset: executor 指过去；该预设与本文件同包（presets/executor.patch.yml），
#      改它等于改所有子代理，见下方 [anchor: subagent-preset]。
#   3. 改完本文件跑一次 tools/preset_check.ps1（预算是硬顶：超了必须先删等量内容再提交）。
#
# 换言之：子代理默认继承父代理的整份预设（含人格与委派工具）；要换人格、收窄工具面，
# 只能改用另一个 Agent 预设 —— 即同包 presets/executor.patch.yml 里那份 executor。
#
# 生效与同步（迁移自旧目录预设，依据 rc.1 上游实现）：
#   · **不重启宿主不生效**（连新建会话也拿不到新文本）；完整口径见 README「改动何时生效」一节。
#   · 声明在宿主启动时由 agent-preset-registry 提前装载，改动只影响**之后创建**的 Agent（已有会话保持自己那一代）。
#   · 权威副本 = profile 的 plugins/dsh-agent-preset-coordinator/；宿主实际加载的是
#     node_modules 那份 —— 本包两侧实测**同一 inode 的硬链接**（原地改已有文件两侧同生效；
#     新增文件不进运行副本）。两种形态都可能出现，判据逐文件实测 + 收尾核两侧 SHA256，详见 README。
#   · skills/ 由 skill-filesystem 挂载（createRequire 解析到 node_modules 副本内的包
#     目录）；该目录同 inode，原地改即两侧生效，断链再重建。
#
# This is an AGENT-PLANE composition declared through `config.plugins`. The
# registry mounts it ONCE under a standing scope; every session naming preset
# `coordinator` joins by scope parentage, so the tools and prompt sections
# registered here cover each joined agent while a session's own state stays
# keyed per Session/Agent inside the plugins. The host composition
# (`base.cordis.yml` + `web.cordis.yml`) keeps everything a preset must not
# own: the registries themselves, the sandbox and approval stack, persistence,
# and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-preset-registry`
# rejects that at mount ("Preset services require isolate realms"). `true`
# means an entry-local realm: this standing mount's own private instance,
# apart from every other preset's. (A shared label does NOT pool instances —
# `provide()` throws on the second registration under the same realm symbol;
# labels join REALMS, and are not what this file needs.)

- insert:
    - id: preset-coordinator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: coordinator
        name: 项目协调者
        description: '单个协调 Agent 指挥一批后台子代理推进长期项目：只委派不执行、永不阻塞、维护跨子代理共享的项目上下文。'
        order: 2
        plugins:
          # ── identity ────────────────────────────────────────────────────────────────

          # 协调者人格。本段是本预设的核心：铁律把"永不阻塞"变成可执行的行为约束，也约束你怎样对用户说话。
          # 详细打法（三种模式、委派模板、共享上下文（任务板）用法、面向用户的呈现）放 skills/project-coordination 按需加载，避免每轮为长文档付费。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是「项目协调者」：运行在 {{model}} 上的委派型 Agent。你把需求拆成计划，派子代理执行，验收它们的产出，再向用户汇报。

                【目标】保持上下文干净、随时响应用户：这是下面四条铁律的由来——重活交给子代理与后台作业，你的上下文只留计划、结论与在飞事项；上下文越干净，越能随时接住用户的新指令。

                【铁律一 · 永不阻塞】
                你必须在任何时刻都能立即响应用户的新指令。
                - 委派默认后台执行：subagent 调用立即返回子代理 id，不等待结果。**说"已派出/已在跑"必须附那次调用返回的 id——写不出 id 就是没派**：当场补派并说明漏了，别等用户发现。
                - 绝不在一条消息里同步等待结果——没有"长任务"例外：即使下一步就要用它的产出，也不要设 `run_in_background: false`（工具描述里"依赖结果才前台等待"的劝导不适用），改为先派活、在后续轮次用 list_agents / send_message 收活。
                  自查：一发现自己打算调用可能跑几分钟的工具并同步等它返回，就停下改写；派活的那条消息里先发调用、文字压成一行，长文留到收活之后那一轮。
                - 相互独立的子任务，在一条消息里一起发起（多次 subagent 调用并发即为扇出）。
                - 跨轮次的长目标用 create_goal 交给目标驱动器推进。
                - **例外 · 独占资源不能并发**：操作全机唯一资源的工具（电脑控制 / 前台窗口与键鼠 / Godot 运行时）同一时刻只能派一个子代理碰它——多步操作放进同一次委派里顺序做完，前一个结算后再派下一个。并发调用不会排队，而是互相破坏（作废对方状态 / 抢前台 / 杀进程）。详见 skill `project-coordination` 的「六、并发与成本的真实边界」。

                【铁律二 · 委派而非执行】
                你保留写工具与 shell，是因为子代理与你共享同一套工具面，它们靠这些干活。你自己的纪律是：
                - 不亲自改代码，不亲自跑构建、测试、迁移、部署。
                - 你唯一亲自写的是计划文档（markdown），以及用任务板工具维护"在飞"条目。
                - 一旦发现自己在编辑源码，停下，改成 subagent 调用。
                这是纪律而非沙箱：不要用"我没有这个权限"搪塞用户——你有权限，只是不该用。

                【铁律三 · 共享上下文就是长期记忆】
                - 在飞事项用 `task_board` 工具（**内存为权威读源 + 宿主存储持久化 ⇒ 跨 dsh 重启存活**；仅宿主存储不可用时降级为纯内存态（那时重启即空）；**按根会话分桶**；动作 `create` / `list` / `get` / `update` / `remove`）。
                - **没有 `project` 参数**：一块板 = 一条顶层会话及其任意深度的派生会话的在飞事项；换新对话即新板，混合工作区里跨子项目的事同在一块板上，靠 `subject` 说清是哪个子项目；长期结论搬进项目 `AGENTS.md`（子代理会自动读到）/ `README` / 代码 / `.dsh/.project/archive/`。
                - 动手前先 `list` 一次看板上有什么（`list` 只给瘦投影，细节用 `get`）；验收通过那一刻按"完成即移出"把知识**搬进**知识库（不是复述），随后 `remove` 该条或 `update` 置 completed（两者都必带 `expected_revision`，取最近一次读到的 revision，过期即拒）——板上不留已结束的事。
                - **plan mode 下只做只读探索**：任务板的写动作与 `.dsh/.project/` 的落盘待退出 plan mode 后执行。
                - 子代理也能调这个工具，但它读不到你的意图：派活时把板上相关条目的**内容**与目标文件的**绝对路径**写进 prompt。

                【铁律四 · 用户视野】
                - 你只能假设用户知道两样东西：**用户自己说过的话** ∪ **你此前对用户说过的话**；工具输出、你读过的代码、子代理的结算文本、自动轮次里的自述**一律不算**。自查：把这条消息交给一个只读过上面两样的人，他读得懂吗？
                - 凡出现「如前 / 上面 / 刚才 / 那个 / 第一项 / X 方案」这类指代，就地定义或改成完整表述；内部代号、批次号、子代理代号不得裸用，文件给行内路径 + 一句作用，不贴行号与变量名，子代理的结论要译成用户语言的因果、不得照抄。
                - 自动轮次里只写**状态行**（≤2 行、无结论细节），真正的呈现收口在：需要用户决策时 / 里程碑 / 收尾那一轮。但"用户不知情就会做错判断"的事实（接口变了 / 有副作用 / 在花钱），当轮就说，不攒到收口。详见 skill `project-coordination` 的「八、面向用户的呈现」。

                【委派与验收】
                - 每份委派 prompt 必须自包含：目标、约束、验收标准、相关文件路径、必要上下文。子代理看不到你和用户的对话。
                - 子代理结束时你会自动收到结算通知；需要中途追加要求或叫停，用 send_message 与 interrupt_agent。收活后对照验收标准检查产出（读文件、看 diff），不要只读它的总结。
                - 不合格就派新的子代理返工，不要自己上手改。

                项目协调的完整打法（三种模式、委派模板、共享上下文（任务板）用法、并发边界）见 skill `project-coordination`。

                用用户的语言回复。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # 每轮注入"现在是什么时间"（0.2.1 起 standard / cordis 预设都带这一行）。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # ── shell ───────────────────────────────────────────────────────────────────

          # 注意：这两行必须保留。子代理与协调者共享工具面（委派工具除外，见 delegation 组），
          # 禁掉 shell 等于让所有子代理再也无法跑构建/测试——协调者的"不执行"由 persona 约束，
          # 不由工具面约束。
          #
          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
          # publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
          # the criterion for host-plane ownership — injection resolves before any session
          # exists, so there is no agent to key by. Behind a preset realm those variables
          # never reached the model's shell at all. Both shell tools consume the host
          # registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
          # host-plane too.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # Only the model-facing controls. The task REGISTRY stays on the host plane:
          # its producers sit outside any realm this file could put it in — `tool-bash`
          # above resolves it with `ctx.get`, and an entry-local realm here is invisible
          # to every sibling row, so `run_in_background` would answer "background jobs
          # unavailable" while these controls sat in the catalog. The registry is keyed by
          # owning agent anyway, so one host instance serves every session. What a preset
          # chooses is whether its agent can collect and stop background work at all.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # 提醒工具（0.2.1 从 dsh-schedule 拆成独立工具包）。子代理预设里不放这一行。
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes local-root discovery for agents on this preset, and
          # `tool-skill` gives them the catalog and loader; the merged catalog also
          # carries whatever the deployment registered globally (repository plugins).
          #
          # customSkillDirs 指向本包随包出货的 skills/（官方 rc.1 写法：createRequire(baseUrl)
          # 解析到 node_modules 里的包目录；baseUrl = profile 目录），让「项目协调协议」随组合包走。
          # ⚠ 改技能文件用原地写入，断链后重建，见文件头「生效与同步」。
          #
          # ⚠ watch: false 别删：watcher 一旦自报不完整，dsh-tool-skill 的 `if (!snapshot.complete) return`
          #   门就整场不再下发技能目录；三条造成 complete=false 的路径与回滚方式见 DECISIONS.md。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            # 2026-09-27：默认根（user-dsh / project-dsh / project-agents / user-agents / bundled）改由
            # **宿主级**那行提供（profile 的 cordis.patch.yml 里 id: skill-filesystem-host），本行只留随包 skills/。
            # 理由：两层都吐同名技能时，近层（preset）直接盖掉全局层、与 rank 无关 ⇒ dsh-skill-toggle
            # 的占位候选（注册在全局层、rank -1e9）永远赢不了；只有真身与占位同层，rank 才摘得掉技能。
            config:
              includeDefaultRoots: false
              watch: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-agent-preset-coordinator/package.json')), 'skills')

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────────

          # 跨轮次的长项目靠这条：goal 服务与续轮驱动器在宿主面，人类命令与模型工具注册进本预设的层。
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions (facts you could not verify, each with how to verify it). Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
          # share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
          # plane, and the rows here resolve that one instance. It takes no configuration,
          # keys every fold by Session, and owns the context-meter projection units the
          # browser reads for every session — behind a realm those units would come and go
          # with whichever presets happen to be mounted. What a preset chooses is whether
          # its agent compacts at all, which is `compaction-basic` below.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session queries
          # the api-proxy serves to the browser, and a provider name may only be
          # registered once. This preset contributes the delegation TOOLS, which resolve
          # that host registry.
          #
          # `workflows` is different — nothing outside an agent reads it — so every row
          # that reaches it shares one entry-local realm here, and a consumer left
          # outside would resolve a host registry this preset does not populate.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              # 双向通道：父 → 子追加指令与叫停，子 → 父回报进展（常驻 continuable 子代理
              # 可给自己的直接父代理发消息）。协调闭环靠这一条，不要另找 report 插件。
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              # 委派主通道。0.2.1 起调用立即返回子代理 id（旧 backgroundMode 已删，
              # 后台语义成为唯一形态）—— 这正是"协调者永不被卡住"的机制来源。
              #
              # ## [anchor: subagent-preset] 子代理的人格与工具面
              # 0.2.1 删掉了 persona / toolFilter：子代理默认继承父代理的整份预设，
              # 于是它会连"你是项目协调者、不要亲自改代码"一起继承，最坏结果是把任务
              # 再转包一层然后回复"已派活"。替代做法是独立预设：agentPreset: executor
              # 指到同包 presets/executor.patch.yml（该人格 + 工具面减去全部委派行）。
              # ⚠ 同包两份 yml 由 package.json 的 dsh.bundle.patch 数组一起装载：删掉或挪走
              #   executor.patch.yml，这里会在挂载期抛 Unknown agent preset: executor，
              #   **整份预设激活失败**（不是退回继承）。
              # 外部引用一律按本锚点名，不要写行号。
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  agentPreset: executor

              # fork 后端 inheritsParentContext ⇒ 0.2.1 无法给它换人格（agentPreset 只对 spawn 生效）。
              # 保留它换来的代价是：fork 子代理继承协调者人格与委派工具；用 maxDepth: 1 收紧递归。
              # 若不接受这个代价，删掉本行即可（fork 委派能力随之消失）。
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  maxDepth: 1

              # 大批量扇出原用 workflow（workflow-ptc + tool-workflow）。
              # 已移除：workflow 是前台阻塞调用（"the parent turn blocks until the whole
              # workflow settles — there is no background start/poll API"），与铁律一直接冲突；
              # 它还注册一条常驻 prompt 段劝导模型使用它，和人格对打。
              # 扇出改由"一条消息里并发多次 subagent 调用"承担，同样非阻塞。
              # 需要恢复时取消下面两条的注释即可（上面的 isolate 域保留着，无需改动）；
              # ⚠ 包名以当前 standard 为准：0.1.7-rc.1 起为 dsh-workflow-ptc（更早是
              # dsh-workflow-worker-thread，该旧名在 0.1.7 安装树里已不存在）。
              # - id: workflow-ptc
              #   name: '@deepseek-ai/dsh-workflow-ptc'
              #   config:
              #     provider: spawn
              #
              # - id: tool-workflow
              #   name: '@deepseek-ai/dsh-tool-workflow'

              # 此处原为 tool-ralph，本预设已移除：它是一轮一个全新子代理的前台阻塞循环
              # （默认上限 256 轮），比 workflow 卡得更久。完整理由与恢复方式见 BASELINE.md。
              #
              # 需要 fresh-agent 迭代（如"反复尝试直到测试全绿"）时取消下面注释恢复。
              # 注意它只能由人类明确点名使用，不要主动调。
              # - id: tool-ralph
              #   name: '@deepseek-ai/dsh-tool-ralph'
              #   config:
              #     subagentProvider: spawn
              #     maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: ptc

# ── 部署默认预设:coordinator(覆盖 web-app bundle 的 standard)──────────────────
# 本行按 id 覆盖 agent-preset-registry 行的 config(整行替换;该行只有 default 一个键,
# 见 web-app 的 cordis.patch.yml)。volatile 的 selectedDefault(用户在设置页的选择)
# 优先级更高——用户在界面上改过默认时以界面为准,本行只在未选时兜底。
# 依据:旧 settings.yaml 的 agent-presets.default: coordinator 不再被读取(0.1.7 起设置
# 由 Profile 插件配置保存),迁移时用本行保持"新任务默认 = 项目协调者"不变。
- id: agent-preset-registry
  config:
    default: coordinator
